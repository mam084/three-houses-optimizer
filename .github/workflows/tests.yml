name: Tests

# Runs the stdlib unittest suite on every push and pull request.
#
# The `test` job deliberately does NOT install streamlit/plotly. The app smoke
# tests (tests/test_app_smoke.py) run against the lightweight stand-ins in
# tests/stubs/, which expose hooks for driving widgets and inspecting what was
# rendered. The real packages don't have those hooks, so installing them would
# make the smoke tests fail for reasons unrelated to the app.
#
# The `import-check` job covers the other side: it installs the real
# requirements.txt and confirms app.py imports cleanly against it.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install test dependencies (stubs stand in for streamlit/plotly)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy Pillow

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  import-check:
    # Separate from `test` above on purpose: this job installs the REAL
    # requirements.txt (including streamlit/plotly) and only checks that
    # app.py and its dependencies actually import cleanly under them - real
    # dependency-version coverage, without running the widget-override-
    # driven smoke tests against the wrong (real, non-stubbed) streamlit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install real dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import app.py against real streamlit/plotly
        run: python -c "import app"
